<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="에어코리아 측정소별 미세먼지와 초미세먼지를 확인하세요.">
  <title>공기 신호등</title>
  <!-- 화면 디자인을 연결하고 /api/dust로 조회하는 스크립트를 불러옵니다. -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="topbar">
      <div>
        <p class="eyebrow">에어코리아 · 대기오염정보</p>
        <h1>공기 신호등</h1>
      </div>
      <!-- 시도를 바꾸면 해당 지역의 측정소를 다시 조회합니다. -->
      <div class="region-control">
        <label for="sido">조회할 시도</label>
        <select id="sido">
          <option>전국</option><option>서울</option><option>부산</option>
          <option>대구</option><option>인천</option><option>광주</option>
          <option>대전</option><option>울산</option><option>세종</option>
          <option>경기</option><option>강원</option><option>충북</option>
          <option>충남</option><option>전북</option><option>전남</option>
          <option>경북</option><option>경남</option><option>제주</option>
        </select>
      </div>
    </header>

    <!-- 지역 대표 상태는 유효한 미세먼지 평균으로 판단합니다. -->
    <section id="summary" class="summary grade-unknown is-loading" aria-labelledby="average-title" aria-busy="true">
      <p id="average-title">전국 · 평균 미세먼지 기준</p>
      <div class="summary-main">
        <div class="signal-line">
          <span id="signal-emoji" aria-hidden="true">⏳</span>
          <strong id="signal-state">불러오는 중...</strong>
        </div>
        <div class="average-block">
          <span class="average-label">평균 미세먼지</span>
          <div class="average-line">
            <strong id="average">—</strong>
            <span id="average-unit" hidden>㎍/㎥</span>
          </div>
        </div>
      </div>
      <p id="air-advice" class="air-advice">측정소의 공기 상태를 확인하고 있어요.</p>
      <div class="summary-meta">
        <p id="average-note">측정 안 된 값은 평균에서 제외합니다.</p>
        <p id="summary-time">측정 시각 확인 중</p>
      </div>
    </section>

    <section aria-labelledby="stations-title">
      <div class="section-heading">
        <h2 id="stations-title">측정소별 공기 상태</h2>
        <button id="refresh" type="button">새로고침</button>
      </div>
      <!-- 색상과 함께 등급 이름도 표시해 상태를 구분합니다. -->
      <ul class="legend" aria-label="미세먼지 등급 안내">
        <li class="grade-1">좋음</li><li class="grade-2">보통</li>
        <li class="grade-3">나쁨</li><li class="grade-4">매우나쁨</li>
        <li class="grade-unknown">등급 없음</li>
      </ul>
      <p id="status" class="status" role="status" aria-live="polite">불러오는 중...</p>
      <div id="stations" class="card-grid" aria-busy="false"></div>
    </section>

    <footer>
      자료 출처: <a href="https://www.data.go.kr/data/15073861/openapi.do" target="_blank" rel="noopener noreferrer">한국환경공단 에어코리아</a> · 실시간 관측 자료<br>
      대표 상태는 측정소의 미세먼지 평균으로 계산합니다. 카드의 등급은 측정소별 제공 등급입니다.
    </footer>
  </main>

  <!-- 각 측정소는 이 틀을 복제하고 안전하게 텍스트를 채워 표시합니다. -->
  <template id="station-template">
    <article class="station-card">
      <div class="card-heading"><h3></h3><span class="badge"></span></div>
      <dl>
        <div><dt>미세먼지</dt><dd class="pm10"></dd></div>
        <div><dt>초미세먼지</dt><dd class="pm25"></dd></div>
      </dl>
      <p class="measured-at"></p>
    </article>
  </template>
</body>
</html>
